services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crypto_terminal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [crypto-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_terminal"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: redis-server --save 60 1
    volumes: [crypto-redis:/data]

volumes:
  crypto-postgres:
  crypto-redis:
